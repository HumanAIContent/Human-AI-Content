<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Black Background -->
  <rect width="200" height="200" fill="#000000"/>
  
  <!-- H - Top (Raised) -->
  <text x="50%" y="32%" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="56" 
        font-weight="900" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="#FFFFFF">H</text>
  
  <!-- + - Middle (Raised) -->
  <text x="50%" y="48%" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="32" 
        font-weight="900" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="#d4af37">+</text>
  
  <!-- AI - Bottom (Raised) -->
  <text x="50%" y="63%" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="36" 
        font-weight="900" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="#FFFFFF">AI</text>
</svg>
