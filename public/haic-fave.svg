<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Black Background -->
  <rect width="200" height="200" fill="#000000"/>
  
  <!-- H - Top -->
  <text x="50%" y="28%" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="48" 
        font-weight="900" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="#FFFFFF">H</text>
  
  <!-- + - Middle (Gold) -->
  <text x="50%" y="48%" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="900" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="#d4af37">+</text>
  
  <!-- AI - Bottom (Same size as H, adjusted Y) -->
  <text x="50%" y="68%" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="48" 
        font-weight="900" 
        text-anchor="middle" 
        dominant-baseline="central"
        fill="#FFFFFF">AI</text>
</svg>
