<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Black Background -->
  <rect width="200" height="200" fill="#000000"/>
  
  <!-- White Border (Frame around the entire square) -->
  <rect x="4" y="4" width="192" height="192" rx="8" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  
  <!-- Gold Plus Symbol - Centered -->
  <!-- Vertical Bar -->
  <rect x="90" y="40" width="20" height="120" rx="2" fill="#d4af37"/>
  
  <!-- Horizontal Bar -->
  <rect x="40" y="90" width="120" height="20" rx="2" fill="#d4af37"/>
</svg>
